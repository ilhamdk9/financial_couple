<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Planner — Ilham ❤️ Adel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ff4d6d">
    <link rel="icon" href="icons/heart-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/heart-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff4d6d;
            --rose: #ffe0e6;
            --cream: #fff7f9;
            --ink: #2a2a2a;
            --radius: 1rem;
        }

        body {
            margin: 0;
            font-family: Poppins, sans-serif;
            background: var(--cream);
            color: var(--ink);
        }

        header {
            background: var(--pink);
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .wrap {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }

        .card {
            background: #fff;
            border: 1px solid #ffd6e0;
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.1);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-box {
            background: var(--rose);
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .amount {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--pink);
        }

        .label {
            font-size: 0.8rem;
            color: #666;
        }

        .daily-limit {
            background: #ff4d6d;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
        }

        .daily-limit .price {
            font-size: 2.5rem;
            font-weight: 800;
            display: block;
        }

        .info-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
        }

        .progress-container {
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--pink);
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap" style="display:flex; justify-content: space-between; align-items: center;">
            <h1 style="margin:0; font-size: 1.2rem;">Perencana Harian 📅</h1>
            <a href="index.html" style="color:white; text-decoration:none;">Kembali</a>
        </div>
    </header>

    <main class="wrap">
        <section class="daily-limit">
            <span class="label" style="color: #ffe0e6;">Jatah Maksimal Hari Ini</span>
            <span id="dailyAmount" class="price">Rp 0</span>
            <span id="daysLeft" class="label" style="color: #ffe0e6;">-- hari tersisa bulan ini</span>
        </section>

        <div class="card">
            <div class="info-text">
                <b>Logika Perhitungan:</b><br>
                (Saldo Bersama Saat Ini - Rp 1.500.000) ÷ Sisa Hari
            </div>
            <div class="grid-stats">
                <div class="stat-box">
                    <span class="label">Dana Siap Pakai</span>
                    <span id="totalBudget" class="amount">Rp 0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Total Terpakai Bersama Hari Ini</span>
                    <span id="spentToday" class="amount">Rp 0</span>
                </div>
            </div>
            <div style="margin-top: 1rem;">
                <span class="label">Progress Bulan Ini</span>
                <div class="progress-container">
                    <div id="monthProgress" class="progress-bar"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX2a-f1UK7iVC-TlmE2iekJMwIs5ccDQU",
            authDomain: "financial-couple-dc3cf.firebaseapp.com",
            projectId: "financial-couple-dc3cf",
            storageBucket: "financial-couple-dc3cf.firebasestorage.app",
            messagingSenderId: "533254877895",
            appId: "1:533254877895:web:52b21c324bcf20f46704e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const fmt = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);

        const KOST_EXPENSE = 1500000;

        function calculatePlanner() {
            const now = new Date();

            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const today = now.getDate();
            const daysRemaining = (lastDay - today) + 1;

            const qContrib = query(collection(db, "contributions"));
            const qExpenseShared = query(collection(db, "expenses"), where("source", "==", "shared"));

            onSnapshot(qContrib, (snapContrib) => {
                let totalUrunanSemua = 0;
                snapContrib.forEach(doc => totalUrunanSemua += doc.data().amount);

                onSnapshot(qExpenseShared, (snapExpense) => {
                    let totalSharedSpentAllTime = 0;
                    let totalSharedSpentToday = 0;

                    const todayStr = new Date().toISOString().slice(0, 10); // Format "YYYY-MM-DD"

                    snapExpense.forEach(doc => {
                        const data = doc.data();
                        const amount = data.amount || 0;

                        // Hitung semua untuk saldo akhir
                        totalSharedSpentAllTime += amount;

                        // Hitung hanya yang tanggalnya hari ini
                        if (data.date === todayStr) {
                            totalSharedSpentToday += amount;
                        }
                    });

                    const saldoBersamaSaatIni = totalUrunanSemua - totalSharedSpentAllTime;
                    const totalDanaTersedia = saldoBersamaSaatIni - KOST_EXPENSE;

                    const dailyLimit = totalDanaTersedia > 0 ? totalDanaTersedia / daysRemaining : 0;

                    // Update UI
                    document.getElementById('dailyAmount').textContent = fmt(dailyLimit);
                    document.getElementById('totalBudget').textContent = fmt(totalDanaTersedia);

                    // Sekarang ini hanya menampilkan pengeluaran bersama HARI INI
                    document.getElementById('spentToday').textContent = fmt(totalSharedSpentToday);

                    document.getElementById('daysLeft').textContent = `${daysRemaining} hari tersisa bulan ini`;

                    const progress = (today / lastDay) * 100;
                    document.getElementById('monthProgress').style.width = progress + '%';
                });
            });
        }

        calculatePlanner();
    </script>
</body>

</html>
